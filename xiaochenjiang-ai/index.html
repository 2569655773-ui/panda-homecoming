+'\n小琛酱：';const urls=['https://gen.pollinations.ai/text/'+encodeURIComponent(prompt)+'?model=openai&private=true','https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai'];for(const u of urls){try{const r=await fetch(u,{method:'GET',cache:'no-store'});const tx=(await r.text()).trim();if(r.ok&&tx&&tx.length>1)return tx.replace(/^小琛酱[:：]/,'').replace(/\n{3,}/g,'\n\n').slice(0,260)}catch(e){}}return local(text)}async function send(){const text=inp.value.trim();if(!text||busy)return;busy=true;btn.disabled=true;add('user',text);hist.push({role:'user',content:text});inp.value='';inp.style.height='auto';const detected=mood(text);moodChip.textContent='感知用户情绪：'+detected;const last=add('ai','……','感知用户情绪：'+detected);try{const rep=await aiReply(text);last.textContent=rep;hist.push({role:'assistant',content:rep})}catch(e){last.textContent=local(text);err('AI接口暂时不稳，已切到本地情绪回复。')}busy=false;btn.disabled=false;inp.focus()}btn.onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,104)+'px'});</script></body></html>
