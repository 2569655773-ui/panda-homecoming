<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>小琛酱 AI版</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff0f5}body{display:flex;flex-direction:column}.top{height:88px;background:linear-gradient(135deg,#ff6fa7,#db3c7a);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;box-shadow:0 8px 24px #db3c7a33}.face{width:54px;height:54px;border-radius:50%;background:#ffe2ec;border:3px solid #ffffffaa;display:flex;align-items:center;justify-content:center;font-size:28px}.name{font-weight:800;font-size:22px;letter-spacing:1px}.online{font-size:13px;margin-top:4px;opacity:.9}.dot{display:inline-block;width:8px;height:8px;background:#78ff8f;border-radius:50%;box-shadow:0 0 8px #78ff8f;margin-right:5px}.chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}.tip{text-align:center;color:#d58ba5;font-size:12px}.row{display:flex;gap:8px;align-items:flex-end;max-width:88%}.ai{align-self:flex-start}.me{align-self:flex-end;flex-direction:row-reverse}.av{width:34px;height:34px;border-radius:50%;background:#ffe1ec;border:2px solid #ffb7d0;display:flex;align-items:center;justify-content:center;flex-shrink:0}.me .av{background:#eadcff;border-color:#d8c2ff;font-size:14px}.b{padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.ai .b{background:#fff;border:1.5px solid #ffd1df;color:#3c1b28;border-bottom-left-radius:5px;box-shadow:0 4px 16px #ff82aa22}.me .b{background:linear-gradient(135deg,#ff6fa7,#db3c7a);color:#fff;border-bottom-right-radius:5px}.bar{display:flex;gap:9px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff6;border-top:1px solid #ffd1df}textarea{flex:1;min-height:43px;max-height:110px;border:1.7px solid #ffd1df;border-radius:22px;padding:10px 15px;font-size:15px;outline:none;resize:none;color:#3c1b28}textarea:focus{border-color:#ff69a3}button{width:43px;height:43px;border:0;border-radius:50%;background:linear-gradient(135deg,#ff6fa7,#db3c7a);color:#fff;font-size:19px;box-shadow:0 5px 14px #db3c7a44}button:disabled{opacity:.45}.err{align-self:center;background:#fff;border:1px solid #ffc2d6;color:#d93067;padding:8px 12px;border-radius:12px;font-size:13px;max-width:90%;text-align:center}</style></head><body><div class="top"><div class="face">🌸</div><div><div class="name">小琛酱</div><div class="online"><span class="dot"></span>在线 · 才不是等你的</div></div></div><div class="chat" id="chat"><div class="tip">— AI公开版：不使用你的豆包 Key —</div><div class="row ai"><div class="av">🌸</div><div class="b">哼，你来了啊……才不是等你的呢。有什么事就说吧，我只是顺便回复你而已！</div></div></div><div class="bar"><textarea id="inp" placeholder="说点什么吧……" rows="1"></textarea><button id="btn">➤</button></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('inp'),btn=document.getElementById('btn');let hist=[],busy=false;function sb(){chat.scrollTop=chat.scrollHeight}function add(r,t){let row=document.createElement('div');row.className='row '+(r==='user'?'me':'ai');let av=document.createElement('div');av.className='av';av.textContent=r==='user'?'你':'🌸';let b=document.createElement('div');b.className='b';b.textContent=t;row.append(av,b);chat.append(row);sb()}function err(t){let e=document.createElement('div');e.className='err';e.textContent=t;chat.append(e);sb();setTimeout(()=>e.remove(),5000)}function local(t){if(/难过|累|烦|崩溃|emo|不开心/.test(t))return'哼，先别一个人硬撑。\n你慢慢说，我听着……才不是担心你。';if(/睡|晚安|熬夜/.test(t))return'还不睡？笨蛋。\n手机放下，明天才有精神。晚安……才不是特意说的。';if(/谢谢|感谢/.test(t))return'哼，这种小事不用谢。\n你别总把自己搞得那么着急就行了。';return'哼……我这边网络有点卡。\n不过我还在，你继续说，才不是不想理你。'}async function aiReply(text){let context=hist.slice(-6).map(m=>(m.role==='user'?'用户：':'小琛酱：')+m.content).join('\n');let prompt='你是“小琛酱”，傲娇但温柔，常说“哼”“才不是”“别误会”，偶尔亲昵称呼“笨蛋”。回复2-4句中文，可爱但不要低俗，不要色情。只输出小琛酱的回复。\n历史：\n'+context+'\n用户：'+text+'\n小琛酱：';let urls=['https://gen.pollinations.ai/text/'+encodeURIComponent(prompt)+'?model=openai&private=true','https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai'];for(const u of urls){try{let r=await fetch(u,{method:'GET',cache:'no-store'});let tx=await r.text();if(r.ok&&tx&&tx.length>2)return tx.replace(/^小琛酱[:：]/,'').trim().slice(0,500)}catch(e){}}return local(text)}async function send(){let text=inp.value.trim();if(!text||busy)return;busy=true;btn.disabled=true;add('user',text);hist.push({role:'user',content:text});inp.value='';inp.style.height='auto';add('ai','正在想怎么回你……才不是紧张。');let last=chat.lastChild.querySelector('.b');try{let rep=await aiReply(text);last.textContent=rep;hist.push({role:'assistant',content:rep})}catch(e){last.textContent=local(text);err('AI接口暂时不可用，已切到本地回复。')}busy=false;btn.disabled=false;inp.focus()}btn.onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px'});</script></body></html>
