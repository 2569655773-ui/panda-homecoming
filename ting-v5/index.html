{let rep=await ai(t);b.classList.remove('thinking');b.textContent=rep;hist.push({role:'assistant',content:rep});last.push(rep);last=last.slice(-6)}catch(e){b.classList.remove('thinking');b.textContent=local(t);err('外部AI不稳，已切到本地回复。')}busy=false;btn.disabled=false;inp.focus()}btn.onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,104)+'px'});</script></body></html>
