用户偏好：'+mem.join('；'):'暂无长期偏好。';let prompt=`你是Ting，一个情绪感知AI。设定：喜欢女孩，金牛座气质，ENTJ式高效，但语气要像亲近的人，不要客服感。不要自称成熟大姐姐，不要解释设定。回复要求：1到5句中文，短句，有温度；先识别用户真实需求再回答；不要自说自话；不要重复“我在/慢慢说/继续”；任务类直接给步骤；饮食类直接给选择；情绪类先接住情绪再轻轻推进；亲近类可轻微调侃但不低俗；记住偏好并延续上下文。${mm}\n当前内部情绪/意图：${m}\n历史：\n${ctx}\n用户：${t}\nTing：`;let urls=['https://gen.pollinations.ai/text/'+encodeURIComponent(prompt)+'?model=openai&private=true&seed='+Date.now(),'https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai&seed='+Date.now()];for(const u of urls){try{const c=new AbortController();const timer=setTimeout(()=>c.abort(),6000);let r=await fetch(u,{cache:'no-store',signal:c.signal});clearTimeout(timer);let tx=await r.text();if(r.ok&&tx.trim().length>1){let rep=clean(tx);if(!last.includes(rep))return rep}}catch(e){}}return local(t)}async function send(){let t=inp.value.trim();if(!t||busy)return;busy=true;btn.disabled=true;learn(t);add('user',t);hist.push({role:'user',content:t});inp.value='';inp.style.height='auto';let b=add('ai','…','thinking');try{let rep=await ai(t);b.classList.remove('thinking');b.textContent=rep;hist.push({role:'assistant',content:rep});last.push(rep);last=last.slice(-6)}catch(e){b.classList.remove('thinking');b.textContent=local(t);err('外部AI不稳，已切到本地回复。')}busy=false;btn.disabled=false;inp.focus()}btn.onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,104)+'px'});</script></body></html>
