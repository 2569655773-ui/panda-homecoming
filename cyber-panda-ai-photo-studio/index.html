<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛博竹林·AI熊猫合影工坊</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:#f5f1e7;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(circle at 20% 10%,rgba(84,255,214,.25),transparent 30%),radial-gradient(circle at 85% 80%,rgba(255,102,196,.14),transparent 32%),linear-gradient(135deg,#050908,#071917 60%,#020303)}canvas{position:fixed;inset:0}.wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(1100px,94vw);min-height:620px;border:1px solid rgba(84,255,214,.3);border-radius:34px;padding:42px;background:linear-gradient(135deg,rgba(4,10,10,.78),rgba(12,39,36,.55));box-shadow:0 26px 90px rgba(0,0,0,.48);overflow:hidden;position:relative}.tag{display:inline-block;padding:9px 14px;border-radius:999px;color:#021614;background:linear-gradient(90deg,#54ffd6,#d8b56e);font-weight:900;letter-spacing:.12em;font-size:13px}h1{font-size:clamp(48px,8vw,106px);line-height:.9;letter-spacing:-.07em;margin:30px 0 22px;text-shadow:0 0 26px rgba(84,255,214,.25)}h1 span{display:block;color:#54ffd6}.sub{max-width:720px;font-size:clamp(18px,2vw,25px);line-height:1.55;color:rgba(245,241,231,.82)}.grid{margin-top:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:850px}.item{border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;background:rgba(255,255,255,.05)}.item b{color:#d8b56e;font-size:18px}.item p{color:rgba(245,241,231,.72);line-height:1.5}.panda{position:absolute;right:6%;bottom:6%;font-size:min(220px,28vw);filter:drop-shadow(0 0 30px rgba(84,255,214,.55));animation:p 3s ease-in-out infinite}@keyframes p{50%{transform:translateY(-16px) scale(1.03)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.panda{opacity:.22;font-size:60vw}.card{padding:28px}}</style></head><body><canvas id="c"></canvas><main class="wrap"><section class="card"><div class="tag">CHENGDU · PANDA AI PHOTO STUDIO</div><h1>赛博竹林<span>AI合影工坊</span></h1><p class="sub">面向成都文旅场景的生成式互动数字媒体体验：熊猫守护灵、全息竹影、粒子交互与治愈电子氛围。</p><div class="grid"><div class="item"><b>01 上传合影</b><p>可扩展游客照片生成动画。</p></div><div class="item"><b>02 竹林粒子</b><p>鼠标靠近形成数据流牵引。</p></div><div class="item"><b>03 情绪传播</b><p>点击触发光晕爆发和打卡瞬间。</p></div></div><div class="panda">🐼</div></section></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let w,h,m={x:innerWidth/2,y:innerHeight/2,d:0};function r(){w=c.width=innerWidth;h=c.height=innerHeight}r();onresize=r;let a=[...Array(150)].map((_,i)=>({x:Math.random()*w,y:Math.random()*h,vx:Math.random()-.5,vy:Math.random()-.5,r:Math.random()*2+1,h:i%3?164:43}));onmousemove=e=>{m.x=e.clientX;m.y=e.clientY};onmousedown=()=>m.d=1;onmouseup=()=>m.d=0;function loop(){x.clearRect(0,0,w,h);a.forEach((p,i)=>{let dx=m.x-p.x,dy=m.y-p.y,dd=Math.hypot(dx,dy)||1,f=Math.max(0,1-dd/220)*(m.d?.08:.025);p.vx+=dx/dd*f;p.vy+=dy/dd*f;p.vx*=.98;p.vy*=.98;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.beginPath();x.fillStyle='hsla('+p.h+',95%,68%,.72)';x.shadowColor='hsl('+p.h+',95%,62%)';x.shadowBlur=14;x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;for(let j=i+1;j<a.length;j+=16){let q=a[j],d=Math.hypot(q.x-p.x,q.y-p.y);if(d<120){x.strokeStyle='rgba(84,255,214,'+(1-d/120)*.18+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(loop)}loop()</script></body></html>
